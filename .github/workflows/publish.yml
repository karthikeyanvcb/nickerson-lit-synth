name: Publish to PyPI

# Uses PyPI Trusted Publishing (no API token in GitHub secrets).
# One-time setup on pypi.org: Account -> Publishing -> add a "pending publisher" with
#   project: nickerson-lit-synth, owner/repo: <you>/nickerson-lit-synth,
#   workflow: publish.yml, environment: pypi
# Then create a GitHub release (e.g. tag v0.1.0) to publish.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nickerson-lit-synth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
